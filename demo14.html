<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Binary Star Custom Lab (Fixed)</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body { margin: 0; background: #050a18; color: #7fd4ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 98%; max-width: 1300px; margin: 20px; background: #0a1128; border: 1px solid rgba(127, 212, 255, 0.2); border-radius: 15px; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        
        .master-controls { display: grid; grid-template-columns: 1fr 1.5fr 1.5fr; gap: 15px; background: rgba(127, 212, 255, 0.05); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid rgba(127, 212, 255, 0.1); }
        .control-group { display: flex; flex-direction: column; gap: 8px; border-right: 1px solid rgba(127, 212, 255, 0.1); padding: 0 10px; }
        .control-group:last-child { border-right: none; }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.85em; }
        
        .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .label { color: #5da9ff; font-size: 0.75em; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
        canvas { width: 100%; background: #00040a; border-radius: 10px; border: 1px solid #1a2a44; }
        .plot-container { height: 300px; background: #00040a; border-radius: 10px; border: 1px solid #1a2a44; }
        
        input[type=number], input[type=text] { background: #1a2a44; border: 1px solid #7fd4ff; color: #fff; padding: 3px; border-radius: 4px; width: 70px; }
        input[type=color] { background: none; border: none; width: 40px; height: 30px; cursor: pointer; }
        input[type=range] { flex-grow: 1; cursor: pointer; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header"><h2>Binary Star Custom Lab</h2></div>

    <div class="master-controls">
        <div class="control-group">
            <div class="label" style="color:#fff">System Parameters</div>
            <div class="control-row">
                <span>Inclination:</span>
                <input type="range" id="incRange" min="0" max="90" value="88" step="0.1">
                <input type="number" id="incInput" value="88" step="0.1">°
            </div>
        </div>

        <div class="control-group">
            <div class="label" style="color:#fff">Star A (Secondary)</div>
            <div class="control-row">
                <span>Color & Type:</span> 
                <input type="color" id="colorA" value="#ffffff">
                <input type="text" id="typeA" value="F0 III">
            </div>
            <div class="control-row">
                <span>Radius (R⊙):</span> 
                <input type="range" id="radARange" min="0.5" max="15" value="6.0" step="0.1">
                <input type="number" id="radAInput" value="6.0">
            </div>
            <div class="control-row">
                <span>Temperature (K):</span> 
                <input type="number" id="tempA" value="7200">
            </div>
        </div>

        <div class="control-group">
            <div class="label" style="color:#fff">Star B (Primary)</div>
            <div class="control-row">
                <span>Color & Type:</span> 
                <input type="color" id="colorB" value="#66ccff">
                <input type="text" id="typeB" value="B1.7 V">
            </div>
            <div class="control-row">
                <span>Radius (R⊙):</span> 
                <input type="range" id="radBRange" min="0.5" max="15" value="5.0" step="0.1">
                <input type="number" id="radBInput" value="5.0">
            </div>
            <div class="control-row">
                <span>Temperature (K):</span> 
                <input type="number" id="tempB" value="22000">
            </div>
        </div>
    </div>

    <div class="viz-grid">
        <div><div class="label">Orbital Dynamics</div><canvas id="orbitCanvas" width="550" height="400"></canvas></div>
        <div><div class="label">Spectroscopy (Doppler Shift)</div><canvas id="specCanvas" width="550" height="400"></canvas></div>
        <div><div class="label">Light Curve (Photometry)</div><div id="lcPlot" class="plot-container"></div></div>
        <div><div class="label">Radial Velocity (RV Curve)</div><div id="rvPlot" class="plot-container"></div></div>
    </div>
</div>

<script>
    const oCanvas = document.getElementById('orbitCanvas');
    const sCanvas = document.getElementById('specCanvas');
    const oCtx = oCanvas.getContext('2d');
    const sCtx = sCanvas.getContext('2d');

    // State Configuration
    let phase = 0;
    let config = {
        inc: 88,
        starA: { color: "#ffffff", radius: 6.0, temp: 7200, type: "F0 III" },
        starB: { color: "#66ccff", radius: 5.0, temp: 22000, type: "B1.7 V" }
    };

    // Control Listeners
    function syncValue(idRange, idInput, key, subKey) {
        const r = document.getElementById(idRange);
        const i = document.getElementById(idInput);
        const update = (v) => {
            if(subKey) config[key][subKey] = v; else config[key] = v;
            r.value = v; i.value = v;
            updateStaticPlots();
        };
        r.addEventListener('input', (e) => update(parseFloat(e.target.value)));
        i.addEventListener('change', (e) => update(parseFloat(e.target.value)));
    }

    syncValue('incRange', 'incInput', 'inc');
    syncValue('radARange', 'radAInput', 'starA', 'radius');
    syncValue('radBRange', 'radBInput', 'starB', 'radius');

    document.getElementById('colorA').oninput = (e) => config.starA.color = e.target.value;
    document.getElementById('colorB').oninput = (e) => config.starB.color = e.target.value;
    document.getElementById('tempA').onchange = (e) => { config.starA.temp = parseFloat(e.target.value); updateStaticPlots(); };
    document.getElementById('tempB').onchange = (e) => { config.starB.temp = parseFloat(e.target.value); updateStaticPlots(); };
    document.getElementById('typeA').oninput = (e) => config.starA.type = e.target.value;
    document.getElementById('typeB').oninput = (e) => config.starB.type = e.target.value;

    function drawStar(ctx, x, y, r, baseColor) {
        ctx.save();
        const drawR = r * 4; 
        const halo = ctx.createRadialGradient(x, y, drawR * 0.2, x, y, drawR * 3);
        halo.addColorStop(0, baseColor + "66"); halo.addColorStop(1, "transparent");
        ctx.fillStyle = halo; ctx.globalCompositeOperation = 'screen';
        ctx.beginPath(); ctx.arc(x, y, drawR * 3, 0, Math.PI * 2); ctx.fill();
        
        ctx.globalCompositeOperation = 'source-over';
        const body = ctx.createRadialGradient(x - drawR*0.3, y - drawR*0.3, 0, x, y, drawR);
        body.addColorStop(0, "#fff"); body.addColorStop(0.3, baseColor); body.addColorStop(1, "#000");
        ctx.fillStyle = body; ctx.beginPath(); ctx.arc(x, y, drawR, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function calculateLight(p, incRad) {
        const x = Math.cos(p), y = Math.sin(p) * Math.cos(incRad);
        const dist = Math.sqrt(x*x + y*y);
        const r1 = config.starA.radius * 0.05, r2 = config.starB.radius * 0.05;
        let brightness = 1.0;

        if (dist < (r1 + r2)) {
            const overlap = Math.max(0, (r1 + r2 - dist) / (r1 + r2));
            const tA = config.starA.temp, tB = config.starB.temp;
            if (Math.sin(p) > 0) { // Star A in front of Star B
                brightness -= (tB / (tA + tB)) * 0.7 * Math.pow(overlap, 1.2);
            } else { // Star B in front of Star A
                brightness -= (tA / (tA + tB)) * 0.7 * Math.pow(overlap, 1.2);
            }
        }
        return brightness;
    }

    function animate() {
        const incRad = config.inc * Math.PI / 180;
        const cx = oCanvas.width / 2, cy = 130;
        oCtx.clearRect(0, 0, oCanvas.width, oCanvas.height);
        sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);

        const x = Math.cos(phase) * 100, y = Math.sin(phase) * 100 * Math.cos(incRad);
        
        // Orbit Path
        oCtx.strokeStyle = "rgba(127, 212, 255, 0.1)";
        oCtx.beginPath(); oCtx.ellipse(cx, cy, 100, 100 * Math.cos(incRad), 0, 0, Math.PI * 2); oCtx.stroke();

        // Stars Layering
        if (Math.sin(phase) > 0) {
            drawStar(oCtx, cx - x, cy - y, config.starB.radius, config.starB.color);
            drawStar(oCtx, cx + x, cy + y, config.starA.radius, config.starA.color);
        } else {
            drawStar(oCtx, cx + x, cy + y, config.starA.radius, config.starA.color);
            drawStar(oCtx, cx - x, cy - y, config.starB.radius, config.starB.color);
        }

        // Info Display
        const drawInfo = (offX, s) => {
            oCtx.fillStyle = "rgba(0,0,0,0.5)"; oCtx.fillRect(cx + offX, 260, 200, 110);
            oCtx.strokeStyle = s.color; oCtx.strokeRect(cx + offX, 260, 200, 110);
            oCtx.fillStyle = s.color; oCtx.font = "bold 15px Arial"; oCtx.fillText(s.type, cx + offX + 15, 285);
            oCtx.fillStyle = "#fff"; oCtx.font = "12px Arial";
            oCtx.fillText(`Radius: ${s.radius} R⊙`, cx + offX + 15, 310);
            oCtx.fillText(`Temp: ${s.temp} K`, cx + offX + 15, 335);
        };
        drawInfo(-210, config.starA); drawInfo(10, config.starB);

        // Spectroscopy Bar
        const barX = 75, barW = 400;
        const grad = sCtx.createLinearGradient(barX, 0, barX + barW, 0);
        grad.addColorStop(0, "#00f"); grad.addColorStop(0.5, "#fff"); grad.addColorStop(1, "#f00");
        sCtx.fillStyle = grad; sCtx.fillRect(barX, 100, barW, 80);

        sCtx.font = "bold 13px Arial";
        sCtx.textAlign = "left"; sCtx.fillStyle = "#66ccff"; sCtx.fillText("← BLUESHIFT (Toward)", barX, 85);
        sCtx.textAlign = "right"; sCtx.fillStyle = "#ff4d4d"; sCtx.fillText("REDSHIFT (Away) →", barX + barW, 85);

        const vA = 35 * Math.sin(incRad) * Math.sin(phase);
        const vB = -60 * Math.sin(incRad) * Math.sin(phase);

        const drawIndicator = (vel, color, label) => {
            const ix = (sCanvas.width/2) + (vel * 3);
            sCtx.strokeStyle = color; sCtx.lineWidth = 3;
            sCtx.beginPath(); sCtx.moveTo(ix, 90); sCtx.lineTo(ix, 190); sCtx.stroke();
            sCtx.fillStyle = color; sCtx.beginPath(); sCtx.arc(ix, 90, 5, 0, 7); sCtx.fill();
            sCtx.textAlign = "center"; sCtx.fillText(label, ix, 210);
            sCtx.fillText(`${vel > 0 ? '+':''}${vel.toFixed(1)} km/s`, ix, 225);
        };
        drawIndicator(vA, config.starA.color, "Star A");
        drawIndicator(vB, config.starB.color, "Star B");

        // Update Plots
        const phaseDeg = (phase * 180 / Math.PI) % 360;
        Plotly.restyle('rvPlot', { x: [[phaseDeg], [phaseDeg]], y: [[vA], [vB]] }, [2, 3]);
        Plotly.restyle('lcPlot', { x: [[phaseDeg]], y: [[calculateLight(phase, incRad)]] }, [1]);

        phase = (phase + 0.02) % (Math.PI * 2);
        requestAnimationFrame(animate);
    }

    function initPlots() {
        const layout = {
            paper_bgcolor: 'transparent', plot_bgcolor: 'rgba(0,0,0,0.3)',
            margin: { t: 10, b: 40, l: 40, r: 10 },
            xaxis: { gridcolor: '#1a2a44', color: '#7fd4ff', range: [0, 360], ticksuffix: '°' },
            yaxis: { gridcolor: '#1a2a44', color: '#7fd4ff', fixedrange: true },
            showlegend: true, legend: { font: { color: '#7fd4ff', size: 10 } }
        };

        Plotly.newPlot('lcPlot', [
            { x: [], y: [], mode: 'lines', line: { color: '#ffcc00' }, name: 'Total Flux' },
            { x: [0], y: [1], mode: 'markers', marker: { color: '#f40', size: 10 }, name: 'Current' }
        ], { ...layout, showlegend: false, yaxis: { ...layout.yaxis, range: [0.2, 1.1] } });

        Plotly.newPlot('rvPlot', [
            { x: [], y: [], name: 'Star A', line: { color: 'rgba(255,255,255,0.2)', dash: 'dot' } },
            { x: [], y: [], name: 'Star B', line: { color: 'rgba(102,204,255,0.2)', dash: 'dot' } },
            { x: [0], y: [0], mode: 'markers', marker: {size: 8}, name: 'RV A' },
            { x: [0], y: [0], mode: 'markers', marker: {
