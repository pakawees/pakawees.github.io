<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Star Sync: Orbit, Spectra & Light Curve</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #050816;
            color: #7fd4ff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            width: 90%;
            max-width: 1100px;
            margin-top: 30px;
            background: rgba(20, 30, 60, 0.6);
            border: 1px solid rgba(127, 212, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .viz-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .viz-container { grid-template-columns: 1fr; }
        }

        canvas {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(127, 212, 255, 0.1);
            border-radius: 10px;
        }

        h2 { margin-top: 0; letter-spacing: 2px; text-transform: uppercase; text-align: center; color: #fff;}
        .label { color: #8caed6; font-size: 0.9em; margin-bottom: 8px; font-weight: bold;}
    </style>
</head>
<body>

<div class="dashboard">
    <h2>Eclipsing Binary System Analysis</h2>
    
    <div class="controls">
        <label>Inclination: </label>
        <input type="range" id="incRange" min="0" max="90" value="85" style="width: 200px;">
        <span id="incValue">85°</span>
        <p style="font-size: 0.8em; color: #8caed6; margin: 5px 0 0 0;">(Try 90° for full eclipse, 0° for face-on)</p>
    </div>

    <div class="viz-container">
        <!-- Orbital View -->
        <div>
            <div class="label">Orbital Configuration</div>
            <canvas id="orbitCanvas" width="500" height="350"></canvas>
        </div>
        
        <!-- Spectrum View -->
        <div>
            <div class="label">Doppler Shift Indicators</div>
            <canvas id="specCanvas" width="500" height="350"></canvas>
        </div>
    </div>

    <!-- Light Curve Plot -->
    <div class="label">Light Curve (Photometry) Sync</div>
    <div id="lcPlot" style="width:100%; height:320px;"></div>
</div>

<script>
    const orbitCanvas = document.getElementById('orbitCanvas');
    const specCanvas = document.getElementById('specCanvas');
    const incRange = document.getElementById('incRange');
    const incValue = document.getElementById('incValue');

    const oCtx = orbitCanvas.getContext('2d');
    const sCtx = specCanvas.getContext('2d');

    let phaseAngle = 0; // 0 to 2*PI
    let inclination = 85;

    // --- Generate Static Light Curve Data ---
    const lcX = [];
    const lcY = [];
    for (let i = 0; i <= 100; i++) {
        let p = (i / 100) * 2 * Math.PI;
        lcX.push(p);
        lcY.push(calculateBrightness(p, 85 * Math.PI / 180));
    }

    function calculateBrightness(angle, incRad) {
        // Simple geometric eclipse model
        const x = Math.cos(angle);
        const y = Math.sin(angle) * Math.cos(incRad);
        const distSq = x*x + y*y;
        
        const r1 = 0.25; // White star radius
        const r2 = 0.15; // Blue star radius
        
        let brightness = 1.0;
        // Check for eclipses (when distance is small)
        if (distSq < (r1 + r2)**2) {
            const depth = (1 - Math.sqrt(distSq)/(r1+r2));
            if (Math.sin(angle) > 0) {
                // Secondary Eclipse (Blue behind White)
                brightness -= 0.15 * depth;
            } else {
                // Primary Eclipse (White behind Blue)
                brightness -= 0.35 * depth;
            }
        }
        return brightness;
    }

    incRange.addEventListener('input', (e) => {
        inclination = e.target.value;
        incValue.innerText = inclination + "°";
        updateStaticLC();
    });

    function drawGlow(ctx, x, y, r, color) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
        g.addColorStop(0, color);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    function drawSpectrumIndicator(ctx, x, yStart, yEnd, color) {
        const overshoot = 20;
        // Background shadow
        ctx.strokeStyle = "rgba(0,0,0,0.8)";
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(x, yStart); ctx.lineTo(x, yEnd); ctx.stroke();
        // Colored line
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, yStart - overshoot); ctx.lineTo(x, yEnd + overshoot); ctx.stroke();
        // Top circle
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, yStart - overshoot, 5, 0, Math.PI * 2); ctx.fill();
    }

    function animate() {
        const incRad = inclination * Math.PI / 180;
        const cx = orbitCanvas.width / 2;
        const cy = orbitCanvas.height / 2;
        const orbitR = 120;

        oCtx.clearRect(0, 0, orbitCanvas.width, orbitCanvas.height);
        sCtx.clearRect(0, 0, specCanvas.width, specCanvas.height);

        // 1. Orbit Simulation
        const x = Math.cos(phaseAngle) * orbitR;
        const y = Math.sin(phaseAngle) * orbitR * Math.cos(incRad);

        oCtx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        oCtx.beginPath();
        oCtx.ellipse(cx, cy, orbitR, orbitR * Math.cos(incRad), 0, 0, Math.PI * 2);
        oCtx.stroke();

        // Depth Sorting
        if (Math.sin(phaseAngle) > 0) {
            drawGlow(oCtx, cx - x, cy - y, 10, "#66ccff"); // Star B (Blue)
            drawGlow(oCtx, cx + x, cy + y, 18, "#ffffff"); // Star A (White)
        } else {
            drawGlow(oCtx, cx + x, cy + y, 18, "#ffffff");
            drawGlow(oCtx, cx - x, cy - y, 10, "#66ccff");
        }

        // 2. Spectrum Simulation
        const sCenter = specCanvas.width / 2;
        const barH = 80; const barY = 120;
        const grad = sCtx.createLinearGradient(50, 0, specCanvas.width - 50, 0);
        grad.addColorStop(0, "#2244ff"); grad.addColorStop(0.5, "#ffffff"); grad.addColorStop(1, "#ff3333");
        sCtx.fillStyle = grad;
        sCtx.fillRect(50, barY, specCanvas.width - 100, barH);

        const amp = 80 * Math.sin(incRad);
        // Note: Sin(phase) represents RV
        const shift = Math.sin(phaseAngle) * amp;

        drawSpectrumIndicator(sCtx, sCenter + (shift * 0.5), barY, barY + barH, "#ffffff");
        drawSpectrumIndicator(sCtx, sCenter - shift, barY, barY + barH, "#66ccff");

        // 3. Update Sync Marker on Light Curve
        const currentBrightness = calculateBrightness(phaseAngle, incRad);
        Plotly.restyle('lcPlot', {
            x: [[phaseAngle]],
            y: [[currentBrightness]]
        }, [1]);

        phaseAngle = (phaseAngle + 0.02) % (2 * Math.PI);
        requestAnimationFrame(animate);
    }

    function initPlot() {
        const traceLC = {
            x: lcX, y: lcY,
            mode: 'lines',
            line: { color: '#4cc9ff', width: 2 },
            name: 'Light Curve'
        };

        const traceMarker = {
            x: [0], y: [1],
            mode: 'markers',
            marker: { color: '#ff3333', size: 12, symbol: 'circle', line: {color: '#fff', width: 2} },
            name: 'Current Phase'
        };

        const layout = {
            paper_bgcolor: 'transparent',
            plot_bgcolor: 'rgba(0,0,0,0.2)',
            margin: { t: 10, b: 40, l: 50, r: 20 },
            xaxis: { title: 'Orbital Phase (Radians)', gridcolor: '#222', range: [0, 2*Math.PI], tickvals: [0, Math.PI, 2*Math.PI], ticktext: ['0', 'π', '2π'] },
            yaxis: { title: 'Relative Brightness', gridcolor: '#222', range: [0.6, 1.05] },
            font: { color: '#7fd4ff' },
            showlegend: false
        };

        Plotly.newPlot('lcPlot', [traceLC, traceMarker], layout);
    }

    function updateStaticLC() {
        const newY = [];
        const incRad = inclination * Math.PI / 180;
        for (let i = 0; i < lcX.length; i++) {
            newY.push(calculateBrightness(lcX[i], incRad));
        }
        Plotly.restyle('lcPlot', { y: [newY] }, [0]);
    }

    initPlot();
    animate();
</script>

</body>
</html>
