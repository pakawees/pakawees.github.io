<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Binary Star Lab - demo14</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body { margin: 0; background: #050a18; color: #7fd4ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 95%; max-width: 1200px; margin: 20px; background: #0a1128; border: 1px solid #1a2a44; border-radius: 10px; padding: 20px; }
        .controls { display: flex; flex-wrap: wrap; gap: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        canvas { width: 100%; background: #000; border: 1px solid #1a2a44; border-radius: 5px; }
        .plot-container { height: 250px; background: #000; border-radius: 5px; }
        input { background: #1a2a44; color: #fff; border: 1px solid #7fd4ff; padding: 2px; }
    </style>
</head>
<body>

<div class="dashboard">
    <h2 style="text-align:center">Binary Star Lab (demo14)</h2>
    
    <div class="controls">
        <div>Inclination: <input type="range" id="inc" min="0" max="90" value="88"></div>
        <div>Star A Color: <input type="color" id="cA" value="#ffffff"></div>
        <div>Star B Color: <input type="color" id="cB" value="#66ccff"></div>
    </div>

    <div class="viz-grid">
        <canvas id="orbit" width="500" height="300"></canvas>
        <canvas id="spec" width="500" height="300"></canvas>
        <div id="lc" class="plot-container"></div>
        <div id="rv" class="plot-container"></div>
    </div>
</div>

<script>
    // ตั้งค่าเริ่มต้น
    const oCanvas = document.getElementById('orbit');
    const sCanvas = document.getElementById('spec');
    const oCtx = oCanvas.getContext('2d');
    const sCtx = sCanvas.getContext('2d');
    
    let phase = 0;
    let config = { inc: 88, colorA: "#ffffff", colorB: "#66ccff" };

    document.getElementById('inc').oninput = (e) => { config.inc = e.target.value; updateStatic(); };
    document.getElementById('cA').oninput = (e) => config.colorA = e.target.value;
    document.getElementById('cB').oninput = (e) => config.colorB = e.target.value;

    function animate() {
        const incRad = config.inc * Math.PI / 180;
        oCtx.clearRect(0,0,500,300);
        sCtx.clearRect(0,0,500,300);

        // วาดดาวโคจร
        const x = Math.cos(phase)*80, y = Math.sin(phase)*80*Math.cos(incRad);
        oCtx.strokeStyle = "#333";
        oCtx.beginPath(); oCtx.ellipse(250,120,80,80*Math.cos(incRad),0,0,Math.PI*2); oCtx.stroke();
        
        // วาดดาวแบบง่าย (เพื่อให้รันได้ทุกที่)
        oCtx.fillStyle = config.colorA; oCtx.beginPath(); oCtx.arc(250+x, 120+y, 15, 0, 7); oCtx.fill();
        oCtx.fillStyle = config.colorB; oCtx.beginPath(); oCtx.arc(250-x, 120-y, 12, 0, 7); oCtx.fill();

        // Spectroscopy
        sCtx.fillStyle = "#fff"; sCtx.fillText("← BLUESHIFT", 50, 50);
        sCtx.fillText("REDSHIFT →", 380, 50);
        
        const vA = 30 * Math.sin(incRad) * Math.sin(phase);
        sCtx.fillStyle = config.colorA; sCtx.fillRect(250+(vA*4), 60, 4, 100);
        sCtx.fillStyle = config.colorB; sCtx.fillRect(250-(vA*6), 60, 4, 100);

        // อัปเดตจุดในกราฟ
        const deg = (phase*180/Math.PI)%360;
        Plotly.restyle('rv', {x:[[deg],[deg]], y:[[vA],[-vA*1.5]]}, [2,3]);

        phase += 0.03;
        requestAnimationFrame(animate);
    }

    function init() {
        const layout = { paper_bgcolor:'black', plot_bgcolor:'black', margin:{t:10,b:30,l:30,r:10}, font:{color:'#7fd4ff'} };
        Plotly.newPlot('lc', [{x:[], y:[], mode:'lines', line:{color:'yellow'}}], layout);
        Plotly.newPlot('rv', [
            {x:[], y:[], name:'A', line:{dash:'dot'}},
            {x:[], y:[], name:'B', line:{dash:'dot'}},
            {x:[0], y:[0], mode:'markers'}, {x:[0], y:[0], mode:'markers'}
        ], layout);
        updateStatic();
        animate();
    }

    function updateStatic() {
        let x=[], yA=[], yB=[];
        for(let i=0; i<360; i+=5) {
            x.push(i);
            yA.push(30 * Math.sin(config.inc*Math.PI/180) * Math.sin(i*Math.PI/180));
            yB.push(-45 * Math.sin(config.inc*Math.PI/180) * Math.sin(i*Math.PI/180));
        }
        Plotly.restyle('rv', {x:[x,x], y:[yA,yB]}, [0,1]);
    }

    init();
</script>
</body>
</html>
