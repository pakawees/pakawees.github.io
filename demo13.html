<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Astro-Physical Binary: Primary Eclipse Adjusted</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body { margin: 0; background: #050a18; color: #7fd4ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 95%; max-width: 1200px; margin: 20px; background: #0a1128; border: 1px solid rgba(127, 212, 255, 0.2); border-radius: 15px; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        .controls { background: rgba(127, 212, 255, 0.05); padding: 12px; border-radius: 10px; display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; }
        .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .label { color: #5da9ff; font-size: 0.75em; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
        canvas { width: 100%; background: #00040a; border-radius: 10px; border: 1px solid #1a2a44; }
        .plot-container { height: 300px; background: #00040a; border-radius: 10px; border: 1px solid #1a2a44; }
        input[type=number] { background: #1a2a44; border: 1px solid #7fd4ff; color: #fff; padding: 4px; border-radius: 4px; width: 55px; text-align: center; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header"><h2>Astro-Physical Binary Observation</h2></div>

    <div class="controls">
        <span>System Inclination (i):</span>
        <input type="range" id="incRange" min="0" max="90" value="88" step="0.1" style="width: 250px;">
        <input type="number" id="incInput" value="88" step="0.1"><span>°</span>
    </div>

    <div class="viz-grid">
        <div><div class="label">Orbital Dynamics (Halo & Limb Darkening)</div><canvas id="orbitCanvas" width="550" height="400"></canvas></div>
        <div><div class="label">Doppler Spectroscopy (Shift Indicators)</div><canvas id="specCanvas" width="550" height="400"></canvas></div>
        <div><div class="label">Photometric Light Curve (Primary = Blue Eclipsed)</div><div id="lcPlot" class="plot-container"></div></div>
        <div><div class="label">Radial Velocity (RV) Plot</div><div id="rvPlot" class="plot-container"></div></div>
    </div>
</div>

<script>
    const oCanvas = document.getElementById('orbitCanvas');
    const sCanvas = document.getElementById('specCanvas');
    const oCtx = oCanvas.getContext('2d');
    const sCtx = sCanvas.getContext('2d');
    const incRange = document.getElementById('incRange');
    const incInput = document.getElementById('incInput');

    let phase = 0;
    let inclination = 88;
    const orbitR = 100;
    const ampWhite = 35;
    const ampBlue = 60;

    function updateInc(val) {
        inclination = parseFloat(val);
        incRange.value = inclination;
        incInput.value = inclination;
        updateStaticPlots();
    }
    incRange.oninput = (e) => updateInc(e.target.value);
    incInput.onchange = (e) => updateInc(e.target.value);

    function drawStar(ctx, x, y, r, baseColor, isWhite) {
        ctx.save();
        const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3);
        halo.addColorStop(0, baseColor + "66"); halo.addColorStop(1, "transparent");
        ctx.fillStyle = halo; ctx.globalCompositeOperation = 'screen';
        ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        const body = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 0, x, y, r);
        if (isWhite) { body.addColorStop(0, '#ffffff'); body.addColorStop(1, '#888'); }
        else { body.addColorStop(0, '#aaddff'); body.addColorStop(1, '#0055ff'); }
        ctx.fillStyle = body; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function calculateLight(p, incRad) {
        const x = Math.cos(p), y = Math.sin(p) * Math.cos(incRad);
        const dist = Math.sqrt(x*x + y*y);
        const r1 = 0.42, r2 = 0.22; 
        let brightness = 1.0;
        if (dist < (r1 + r2)) {
            const overlap = Math.max(0, (r1 + r2 - dist) / (r1 + r2));
            // Primary Eclipse: เมื่อดาวฟ้า (ร้อนกว่า) ถูกบัง (sin p > 0 คือดาวขาวอยู่หน้า)
            if (Math.sin(p) > 0) {
                brightness -= 0.50 * Math.pow(overlap, 1.2); 
            } else {
                // Secondary Eclipse: เมื่อดาวขาว (เย็นกว่า) ถูกบัง
                brightness -= 0.12 * Math.pow(overlap, 1.5);
            }
        }
        return brightness;
    }

    function animate() {
        const incRad = inclination * Math.PI / 180;
        const cx = oCanvas.width / 2, cy = 130;
        oCtx.clearRect(0, 0, oCanvas.width, oCanvas.height);
        sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);

        const x = Math.cos(phase) * orbitR, y = Math.sin(phase) * orbitR * Math.cos(incRad);
        oCtx.strokeStyle = "rgba(127, 212, 255, 0.1)";
        oCtx.beginPath(); oCtx.ellipse(cx, cy, orbitR, orbitR * Math.cos(incRad), 0, 0, Math.PI * 2); oCtx.stroke();

        // วาดดาวตามลำดับ Depth (Z-order)
        if (Math.sin(phase) > 0) {
            drawStar(oCtx, cx - x, cy - y, 20, "#66ccff", false); // Blue
            drawStar(oCtx, cx + x, cy + y, 35, "#ffffff", true);  // White (Front)
        } else {
            drawStar(oCtx, cx + x, cy + y, 35, "#ffffff", true);  // White
            drawStar(oCtx, cx - x, cy - y, 20, "#66ccff", false); // Blue (Front)
        }

        const cardY = 270, cardW = 190, cardH = 100;
        const drawCard = (cx_off, title, color, r, temp, type) => {
            oCtx.fillStyle = "rgba(15, 25, 50, 0.8)"; oCtx.strokeStyle = "rgba(127, 212, 255, 0.2)";
            oCtx.beginPath(); oCtx.roundRect(cx + cx_off, cardY, cardW, cardH, 10); oCtx.fill(); oCtx.stroke();
            oCtx.fillStyle = color; oCtx.font = "bold 15px Arial"; oCtx.fillText(title, cx + cx_off + 15, cardY + 28);
            oCtx.fillStyle = "#fff"; oCtx.font = "12px Arial";
            oCtx.fillText(`Radius: ${r} R\u2299`, cx + cx_off + 15, cardY + 52);
            oCtx.fillText(`Temperature: ${temp} K`, cx + cx_off + 15, cardY + 72);
            oCtx.fillText(`Spectral Type: ${type}`, cx + cx_off + 15, cardY + 92);
        };
        drawCard(-205, "White Star", "#ffffff", "6.0", "7200", "F0 III");
        drawCard(15, "Blue Star", "#66ccff", "5.0", "14500", "B5 IV");

        const barW = 400, barH = 80, sX = (sCanvas.width - barW) / 2;
        const grad = sCtx.createLinearGradient(sX, 0, sX + barW, 0);
        grad.addColorStop(0, "#00f"); grad.addColorStop(0.5, "#fff"); grad.addColorStop(1, "#f00");
        sCtx.fillStyle = grad; sCtx.fillRect(sX, 100, barW, barH);

        const vW = ampWhite * Math.sin(incRad) * Math.sin(phase);
        const vB = -ampBlue * Math.sin(incRad) * Math.sin(phase);
        // --- วาด Static Labels (อยู่กับที่) ---
        sCtx.font = "bold 13px Arial";
        
        // ชิดซ้าย: Blue
        sCtx.textAlign = "left";
        sCtx.fillStyle = "#66ccff";
        sCtx.fillText("← BLUESHIFT (Toward)", sX + 15, 80);

        // ชิดขวา: Red
        sCtx.textAlign = "right";
        sCtx.fillStyle = "#ff4d4d";
        sCtx.fillText("REDSHIFT (Away) →", sCanvas.width - (sX + 15), 80);

        // --- วาด Indicator (เฉพาะเส้นและตัวเลขที่เลื่อน) ---
        const drawShift = (vel, color) => {
            const ix = (sCanvas.width/2) + (vel * 3);
            sCtx.strokeStyle = color; sCtx.lineWidth = 3;
            sCtx.beginPath(); sCtx.moveTo(ix, 90); sCtx.lineTo(ix, 190); sCtx.stroke();
            sCtx.fillStyle = color; sCtx.beginPath(); sCtx.arc(ix, 90, 5, 0, 7); sCtx.fill();
            
            sCtx.font = "bold 11px Arial";
            sCtx.textAlign = "center";
            sCtx.fillStyle = color;
            sCtx.fillText(`${vel > 0 ? '+':''}${vel.toFixed(1)} km/s`, ix, 210);
        };
        drawShift(vW, "#fff"); 
        drawShift(vB, "#66ccff");

        sCtx.fillStyle = "rgba(0,0,0,0.6)"; sCtx.beginPath(); sCtx.roundRect(sX, 260, barW, 60, 8); sCtx.fill();
        sCtx.textAlign = "left"; sCtx.font = "bold 13px monospace";
        sCtx.fillStyle = "#66ccff"; sCtx.fillText(`Blue Star (Primary):  ${vB.toFixed(2)} km/s`, sX + 15, 285);
        sCtx.fillStyle = "#ffffff"; sCtx.fillText(`White Star (Secondary): ${vW.toFixed(2)} km/s`, sX + 15, 305);

        const phaseDeg = (phase * 180 / Math.PI) % 360;
        Plotly.restyle('rvPlot', { x: [[phaseDeg], [phaseDeg]], y: [[vW], [vB]] }, [2, 3]);
        Plotly.restyle('lcPlot', { x: [[phaseDeg]], y: [[calculateLight(phase, incRad)]] }, [1]);

        phase = (phase + 0.025) % (Math.PI * 2);
        requestAnimationFrame(animate);
    }

    function initPlots() {
        const layout = {
            paper_bgcolor: 'transparent', plot_bgcolor: 'rgba(0,0,0,0.2)',
            margin: { t: 20, b: 40, l: 50, r: 20 },
            xaxis: { gridcolor: '#1a2a44', color: '#7fd4ff', range: [0, 360], ticksuffix: '°' },
            yaxis: { gridcolor: '#1a2a44', color: '#7fd4ff', fixedrange: true },
            showlegend: false
        };

        Plotly.newPlot('lcPlot', [
            { x: [], y: [], mode: 'lines', line: { color: '#ffcc00', width: 3 } },
            { x: [0], y: [1], mode: 'markers', marker: { color: '#f40', size: 10, symbol: 'diamond' } }
        ], { ...layout, yaxis: { ...layout.yaxis, title: 'Flux', range: [0.45, 1.1] } });

        Plotly.newPlot('rvPlot', [
            { x: [], y: [], mode: 'lines', line: { color: 'rgba(255,255,255,0.15)', dash: 'dot' } },
            { x: [], y: [], mode: 'lines', line: { color: 'rgba(102,204,255,0.15)', dash: 'dot' } },
            { x: [0], y: [0], mode: 'markers', marker: { color: '#fff', size: 8 } },
            { x: [0], y: [0], mode: 'markers', marker: { color: '#66ccff', size: 8 } }
        ], { ...layout, yaxis: { ...layout.yaxis, title: 'Velocity (km/s)', range: [-75, 75] } });

        updateStaticPlots();
    }

    function updateStaticPlots() {
        let x = [], yL = [], yW = [], yB = [];
        const incRad = inclination * Math.PI / 180;
        for(let i=0; i<=360; i+=2) {
            let p = i * Math.PI / 180; x.push(i);
            yL.push(calculateLight(p, incRad));
            yW.push(ampWhite * Math.sin(incRad) * Math.sin(p));
            yB.push(-ampBlue * Math.sin(incRad) * Math.sin(p));
        }
        Plotly.restyle('lcPlot', { x: [x], y: [yL] }, [0]);
        Plotly.restyle('rvPlot', { x: [x, x], y: [yW, yB] }, [0, 1]);
    }

    initPlots(); animate();
</script>
</body>
</html>
