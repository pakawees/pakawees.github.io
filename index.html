<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<script>

/* =========================================================
   LIGHT CURVE : ECLIPSING BINARY
   Blue star = brighter
   White star = dimmer
========================================================= */

/* ---------- DATA ---------- */

let phase = [];
let brightness = [];

for(let i=0;i<500;i++){

    let x = i/500 * 2;

    /* 
       PRIMARY ECLIPSE
       White star blocks brighter blue star
       -> deeper minimum

       SECONDARY ECLIPSE
       Blue star blocks dimmer white star
       -> shallower minimum
    */

    let y =
        1
        - 0.35*Math.exp(-((x-0.5)**2)/0.003)
        - 0.15*Math.exp(-((x-1.5)**2)/0.008)
        + 0.02*Math.sin(8*x);

    phase.push(x);
    brightness.push(y);
}

/* ---------- MAIN CURVE ---------- */

const trace = {

    x: phase,
    y: brightness,

    mode:'lines',

    name:'Light Curve',

    line:{
        color:'#66ccff',
        width:3
    }

};

/* ---------- PRIMARY MINIMUM MARKER ---------- */

const primaryPoint = {

    x:[0.5],
    y:[0.65],

    mode:'markers',

    marker:{
        size:10,
        color:'#ffffff'
    },

    name:'Primary Eclipse'

};

/* ---------- SECONDARY MINIMUM MARKER ---------- */

const secondaryPoint = {

    x:[1.5],
    y:[0.85],

    mode:'markers',

    marker:{
        size:10,
        color:'#66ccff'
    },

    name:'Secondary Eclipse'

};

/* ---------- LAYOUT ---------- */

const layout = {

    paper_bgcolor:'rgba(0,0,0,0)',
    plot_bgcolor:'rgba(0,0,0,0)',

    font:{
        color:'#dcecff'
    },

    xaxis:{

        title:'Orbital Phase',

        gridcolor:'rgba(255,255,255,0.1)',

        zeroline:false

    },

    yaxis:{

        title:'Relative Brightness',

        gridcolor:'rgba(255,255,255,0.1)',

        range:[0.55,1.05]

    },

    margin:{
        t:40
    },

    legend:{
        orientation:'h',
        y:1.1
    },

    /* ---------- SHADED ECLIPSE REGIONS ---------- */

    shapes:[

        /* PRIMARY */

        {

            type:'rect',

            x0:0.42,
            x1:0.58,

            y0:0,
            y1:1.1,

            fillcolor:'rgba(255,255,255,0.08)',

            line:{
                width:0
            }

        },

        /* SECONDARY */

        {

            type:'rect',

            x0:1.40,
            x1:1.60,

            y0:0,
            y1:1.1,

            fillcolor:'rgba(102,204,255,0.08)',

            line:{
                width:0
            }

        }

    ],

    /* ---------- LABELS ---------- */

    annotations:[

        {

            x:0.5,
            y:0.64,

            text:
                '<b>PRIMARY ECLIPSE</b><br>' +
                'White star eclipses brighter blue star',

            showarrow:true,

            arrowhead:2,

            ax:0,
            ay:-70,

            font:{
                color:'#ffffff',
                size:14
            }

        },

        {

            x:1.5,
            y:0.84,

            text:
                '<b>SECONDARY ECLIPSE</b><br>' +
                'Blue star eclipses dimmer white star',

            showarrow:true,

            arrowhead:2,

            ax:0,
            ay:-70,

            font:{
                color:'#66ccff',
                size:14
            }

        }

    ]

};

/* ---------- PLOT ---------- */

Plotly.newPlot(

    'lightcurve',

    [
        trace,
        primaryPoint,
        secondaryPoint
    ],

    layout,

    {
        responsive:true
    }

);

</script>
