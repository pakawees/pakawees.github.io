<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Binary Lab - Fully Operational</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body { margin: 0; background: #050a18; color: #7fd4ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 98%; max-width: 1200px; margin: 15px; background: #0a1128; border: 1px solid #1a2a44; border-radius: 10px; padding: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .master-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; background: rgba(127, 212, 255, 0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(127, 212, 255, 0.1); font-size: 0.9em; }
        .ctrl-group { display: flex; flex-direction: column; gap: 8px; border-right: 1px solid rgba(127, 212, 255, 0.1); padding: 0 10px; }
        .ctrl-group:last-child { border-right: none; }
        .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        canvas { width: 100%; background: #000; border: 1px solid #1a2a44; border-radius: 5px; }
        .plot-container { height: 260px; background: #000; border-radius: 5px; }
        .data-readout { font-family: 'Courier New', monospace; font-size: 13px; margin-top: 5px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 4px; line-height: 1.4; border: 1px solid rgba(255,255,255,0.1); font-weight: bold; }
        select, input { background: #1a2a44; color: #fff; border: 1px solid #7fd4ff; border-radius: 3px; padding: 3px; }
        .manual-input { width: 65px; text-align: center; font-weight: bold; color: #ffcc00; }
        .label-text { font-weight: bold; color: #ffcc00; margin-bottom: 5px; display: block; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    </style>
</head>
<body>

<div class="dashboard">
    <h2 style="text-align:center; color:#fff; margin-top:0;">Barycentric Orbit Simulator (Light Curve Fixed)</h2>
    
    <div class="master-controls">
        <div class="ctrl-group">
            <span class="label-text">SYSTEM PARAMETERS</span>
            <div class="input-row">
                <span>Semimajor Axis:</span>
                <input type="number" id="distNum" class="manual-input" value="2.00" step="0.1" min="0.1">
                <span>AU</span>
            </div>
            <input type="range" id="distRange" min="0.5" max="10" value="2.0" step="0.1" style="width:100%">
            
            <div class="input-row" style="margin-top:10px;">
                <span>Inclination:</span>
                <input type="number" id="incNum" class="manual-input" value="88" min="0" max="90" step="1">
                <span>°</span>
            </div>
            <input type="range" id="incRange" min="0" max="90" value="88" step="1" style="width:100%">
            
            <div id="physicsReadout" class="data-readout" style="color:#0f0;"></div>
        </div>

        <div class="ctrl-group">
            <span class="label-text">STAR A SETTINGS</span>
            <div>Spectral: 
                <select id="classA">
                    <option value="O">O</option><option value="B">B</option><option value="A">A</option>
                    <option value="F" selected>F</option><option value="G">G</option><option value="K">K</option><option value="M">M</option>
                </select>
            </div>
            <div>Luminosity: 
                <select id="typeA">
                    <option value="I">I</option><option value="III">III</option><option value="V" selected>V</option>
                </select>
            </div>
            <div id="starAReadout" class="data-readout"></div>
        </div>

        <div class="ctrl-group">
            <span class="label-text">STAR B SETTINGS</span>
            <div>Spectral: 
                <select id="classB">
                    <option value="O">O</option><option value="B">B</option><option value="A">A</option>
                    <option value="G" selected>G</option><option value="K">K</option><option value="M">M</option>
                </select>
            </div>
            <div>Luminosity: 
                <select id="typeB">
                    <option value="I">I</option><option value="III">III</option><option value="V" selected>V</option>
                </select>
            </div>
            <div id="starBReadout" class="data-readout"></div>
        </div>
    </div>

    <div class="viz-grid">
        <canvas id="orbit" width="500" height="300"></canvas>
        <canvas id="spec" width="500" height="300"></canvas>
        <div id="lc" class="plot-container"></div>
        <div id="rv" class="plot-container"></div>
    </div>
</div>

<script>
    const oCtx = document.getElementById('orbit').getContext('2d');
    const sCtx = document.getElementById('spec').getContext('2d');
    let phase = 0, system = { dist: 2.0, inc: 88, period: 1 }, stars = { a: {}, b: {} };

    function setupSync(numId, rangeId) {
        const num = document.getElementById(numId);
        const range = document.getElementById(rangeId);
        num.addEventListener('input', () => { range.value = num.value; updateDynamics(); });
        range.addEventListener('input', () => { num.value = range.value; updateDynamics(); });
    }

    function getAstroData(sClass, type) {
        const massMap = { O:40, B:15, A:2.1, F:1.4, G:1.0, K:0.8, M:0.4 };
        const tempMap = { O:35000, B:20000, A:9000, F:7000, G:5800, K:4500, M:3000 };
        const colorMap = { O:"#44f", B:"#aaf", A:"#fff", F:"#ffc", G:"#ff0", K:"#f90", M:"#f30" };
        let m = massMap[sClass], r = (type==="V") ? Math.pow(m, 0.8) : 12;
        return { mass: m, temp: tempMap[sClass], radius: r, color: colorMap[sClass], lum: Math.pow(r,2)*Math.pow(tempMap[sClass]/5800,4) };
    }

    // ฟังก์ชันคำนวณแสงที่หายไป (สำคัญมาก)
    function calcLight(p) {
        const iRad = system.inc * Math.PI / 180;
        const totalDist = stars.a.visRadius + stars.b.visRadius;
        
        // คำนวณระยะห่างปรากฏของดาวสองดวงบนระนาบฟ้า
        const dx = totalDist * Math.cos(p);
        const dy = totalDist * Math.sin(p) * Math.cos(iRad);
        const sep = Math.sqrt(dx*dx + dy*dy);
        
        const r_sum = (stars.a.radius + stars.b.radius) * 1.5; // Scale สำหรับการบังกัน
        const totalL = stars.a.lum + stars.b.lum;

        if (sep < r_sum) {
            const overlap = Math.max(0, (r_sum - sep) / r_sum);
            // ตรวจสอบว่าดวงไหนอยู่หน้า (xA > 0 หรือ xB > 0 ขึ้นกับเฟส)
            if (Math.sin(p) > 0) {
                return (totalL - (stars.b.lum * overlap * 0.8)) / totalL; // บังดวง B
            } else {
                return (totalL - (stars.a.lum * overlap * 0.8)) / totalL; // บังดวง A
            }
        }
        return 1.0;
    }

    function updateDynamics() {
        system.dist = parseFloat(document.getElementById('distNum').value) || 0.1;
        system.inc = parseFloat(document.getElementById('incNum').value) || 0;
        
        stars.a = getAstroData(document.getElementById('classA').value, document.getElementById('typeA').value);
        stars.b = getAstroData(document.getElementById('classB').value, document.getElementById('typeB').value);

        const totalM = stars.a.mass + stars.b.mass;
        system.period = Math.sqrt(Math.pow(system.dist, 3) / totalM);
        
        const visualScale = 160 / (system.dist + 1); 
        stars.a.visRadius = system.dist * (stars.b.mass / totalM) * visualScale;
        stars.b.visRadius = system.dist * (stars.a.mass / totalM) * visualScale;

        const v_total = (2 * Math.PI * system.dist * 1.496e8) / (system.period * 3.154e7);
        stars.a.v_orb = v_total * (stars.b.mass / totalM);
        stars.b.v_orb = v_total * (stars.a.mass / totalM);

        document.getElementById('physicsReadout').innerHTML = `Period: ${system.period.toFixed(2)} yrs | V_total: ${v_total.toFixed(1)} km/s`;
        updateStaticPlots();
    }

    function animate() {
        const iRad = system.inc * Math.PI / 180;
        const cosI = Math.cos(iRad);
        oCtx.clearRect(0,0,500,300); sCtx.clearRect(0,0,500,300);

        oCtx.fillStyle = "white"; oCtx.beginPath(); oCtx.arc(250,150,2,0,7); oCtx.fill();

        const xA = Math.cos(phase)*stars.a.visRadius, yA = Math.sin(phase)*stars.a.visRadius*cosI;
        const xB = Math.cos(phase+Math.PI)*stars.b.visRadius, yB = Math.sin(phase+Math.PI)*stars.b.visRadius*cosI;

        oCtx.setLineDash([3, 5]); oCtx.strokeStyle = "#1a2a44";
        oCtx.beginPath(); oCtx.ellipse(250,150,stars.a.visRadius,stars.a.visRadius*cosI,0,0,7); oCtx.stroke();
        oCtx.beginPath(); oCtx.ellipse(250,150,stars.b.visRadius,stars.b.visRadius*cosI,0,0,7); oCtx.stroke();
        oCtx.setLineDash([]);

        const drawS = (x, y, r, col) => {
            oCtx.shadowBlur = 10; oCtx.shadowColor = col; oCtx.fillStyle = col;
            oCtx.beginPath(); oCtx.arc(250+x, 150+y, Math.max(3, r*0.4), 0, 7); oCtx.fill();
            oCtx.shadowBlur = 0;
        };
        if(Math.sin(phase)>0){ drawS(xB, yB, stars.b.radius, stars.b.color); drawS(xA, yA, stars.a.radius, stars.a.color); }
        else { drawS(xA, yA, stars.a.radius, stars.a.color); drawS(xB, yB, stars.b.radius, stars.b.color); }

        const vA_obs = stars.a.v_orb * Math.sin(iRad) * Math.sin(phase);
        const vB_obs = -stars.b.v_orb * Math.sin(iRad) * Math.sin(phase);
        
        const grad = sCtx.createLinearGradient(50,0,450,0); grad.addColorStop(0,"blue"); grad.addColorStop(0.5,"white"); grad.addColorStop(1,"red");
        sCtx.fillStyle = grad; sCtx.fillRect(50, 100, 400, 80);
        const drawL = (v, s) => { sCtx.strokeStyle = s.color; sCtx.lineWidth=3; sCtx.beginPath(); sCtx.moveTo(250+v, 95); sCtx.lineTo(250+v, 185); sCtx.stroke(); };
        drawL(vA_obs, stars.a); drawL(vB_obs, stars.b);

        if(window.Plotly) {
            const d = (phase*180/Math.PI)%360;
            const currentLight = calcLight(phase);
            Plotly.restyle('lc', { x: [[d]], y: [[currentLight]] }, [1]);
            Plotly.restyle('rv', { x: [[d], [d]], y: [[vA_obs], [vB_obs]] }, [2, 3]);
        }
        phase += 0.04 / (system.period + 0.1);
        requestAnimationFrame(animate);
    }

    function updateStaticPlots() {
        let x = [], yL = [], yA = [], yB = [];
        const si = Math.sin(system.inc * Math.PI / 180);
        for (let i = 0; i <= 360; i += 2) {
            let p = i * Math.PI / 180;
            x.push(i);
            yL.push(calcLight(p));
            yA.push(stars.a.v_orb * si * Math.sin(p));
            yB.push(-stars.b.v_orb * si * Math.sin(p));
        }
        Plotly.restyle('lc', { x: [x], y: [yL] }, [0]); 
        Plotly.restyle('rv', { x: [x, x], y: [yA, yB] }, [0, 1]);
    }

    window.onload = () => {
        setupSync('distNum', 'distRange');
        setupSync('incNum', 'incRange');
        const layout = { paper_bgcolor:'black', plot_bgcolor:'#050a18', margin:{t:30,b:35,l:45,r:15}, font:{color:'#7fd4ff', size:10}, xaxis:{gridcolor:'#1a2a44', range:[0,360]}, yaxis:{gridcolor:'#1a2a44', fixedrange:true}};
        Plotly.newPlot('lc', [{x:[], y:[], name:'Flux', line:{color:'yellow'}}, {x:[0], y:[1], mode:'markers', marker:{color:'red'}, name:'Now'}], {...layout, yaxis:{range:[0.5, 1.1]}});
        Plotly.newPlot('rv', [{x:[], y:[], name:'RV A'}, {x:[], y:[], name:'RV B'}, {x:[0], y:[0], mode:'markers'}, {x:[0], y:[0], mode:'markers'}], {...layout, yaxis:{range:[-300, 300]}});
        document.querySelectorAll('select').forEach(e => e.onchange = updateDynamics);
        updateDynamics(); animate();
    };
</script>
</body>
</html>
