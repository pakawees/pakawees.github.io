<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Binary Lab - demo15</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body { margin: 0; background: #050a18; color: #7fd4ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 98%; max-width: 1200px; margin: 15px; background: #0a1128; border: 1px solid #1a2a44; border-radius: 10px; padding: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .master-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; background: rgba(127, 212, 255, 0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(127, 212, 255, 0.1); font-size: 0.9em; }
        .ctrl-group { display: flex; flex-direction: column; gap: 8px; border-right: 1px solid rgba(127, 212, 255, 0.1); padding: 0 10px; }
        .ctrl-group:last-child { border-right: none; }
        .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        canvas { width: 100%; background: #000; border: 1px solid #1a2a44; border-radius: 5px; }
        .plot-container { height: 260px; background: #000; border-radius: 5px; }
        .data-readout { font-family: 'Courier New', monospace; font-size: 14px; margin-top: 5px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 4px; line-height: 1.5; border: 1px solid rgba(255,255,255,0.1); }
        select, input { background: #1a2a44; color: #fff; border: 1px solid #7fd4ff; border-radius: 3px; padding: 2px; }
        .label-text { font-weight: bold; color: #ffcc00; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

<div class="dashboard">
    <h2 style="text-align:center; color:#fff; margin-top:0;">Binary Star Physics Lab</h2>
    
    <div class="master-controls">
        <div class="ctrl-group">
            <span class="label-text">SYSTEM PARAMETERS</span>
            <div>Distance: <input type="range" id="distAU" min="0.05" max="10" value="1.0" step="0.05"> <span id="auVal">1.0</span> AU</div>
            <div>Inclination: <input type="range" id="inc" min="0" max="90" value="88"> <span id="incVal">88</span>°</div>
            <div id="physicsReadout" class="data-readout" style="color:#0f0;"></div>
        </div>

        <div class="ctrl-group">
            <span class="label-text">STAR A</span>
            <div>Spectral: 
                <select id="classA">
                    <option value="W">W (Wolf-Rayet)</option><option value="O">O</option><option value="B">B</option>
                    <option value="A">A</option><option value="F" selected>F</option><option value="G">G</option>
                    <option value="K">K</option><option value="M">M</option>
                </select>
                Sub: <input type="number" id="subA" min="0" max="9" value="0" style="width:35px">
            </div>
            <div>Type: 
                <select id="typeA">
                    <option value="I">I (Supergiant)</option><option value="III" selected>III (Giant)</option>
                    <option value="V">V (Dwarf)</option><option value="d">d (White Dwarf)</option>
                </select>
            </div>
            <div id="starAReadout" class="data-readout"></div>
        </div>

        <div class="ctrl-group">
            <span class="label-text">STAR B</span>
            <div>Spectral: 
                <select id="classB">
                    <option value="W">W (Wolf-Rayet)</option><option value="O">O</option><option value="B" selected>B</option><option value="A">A</option>
                    <option value="F">F</option><option value="G">G</option><option value="K">K</option><option value="M">M</option>
                </select>
                Sub: <input type="number" id="subB" min="0" max="9" value="1.7" style="width:35px">
            </div>
            <div>Type: 
                <select id="typeB">
                    <option value="I">I (Supergiant)</option><option value="III">III (Giant)</option>
                    <option value="V" selected>V (Dwarf)</option><option value="d">d (White Dwarf)</option>
                </select>
            </div>
            <div id="starBReadout" class="data-readout"></div>
        </div>
    </div>

    <div class="viz-grid">
        <canvas id="orbit" width="500" height="300"></canvas>
        <canvas id="spec" width="500" height="300"></canvas>
        <div id="lc" class="plot-container"></div>
        <div id="rv" class="plot-container"></div>
    </div>
</div>

<script>
    const oCtx = document.getElementById('orbit').getContext('2d');
    const sCtx = document.getElementById('spec').getContext('2d');
    let phase = 0, system = { dist: 1.0, inc: 88, velocity: 0, period: 0 }, stars = { a: {}, b: {} };

    function getAstroData(sClass, sub, type) {
        const tempBase = { W: 45000, O: 35000, B: 15000, A: 8500, F: 6500, G: 5500, K: 4000, M: 3000 };
        const massBase = { W: 60, O: 40, B: 10, A: 2.0, F: 1.4, G: 1.0, K: 0.7, M: 0.3 };
        
        let temp = tempBase[sClass] - (sub * 200);
        let mass = massBase[sClass] * (1 - sub/30);
        let radius = 1.0;
        let color = "#fff";

        // สีตามชนิดดาว
        if(sClass === "W" || sClass === "O") color = "#3366ff"; // น้ำเงินเข้ม
        else if(sClass === "B") color = "#aad4ff"; // น้ำเงินขาว
        else if(sClass === "A") color = "#ffffff"; // ขาว
        else if(sClass === "F") color = "#ffffcc"; // ขาวเหลือง
        else if(sClass === "G") color = "#ffff00"; // เหลือง
        else if(sClass === "K") color = "#ff9900"; // ส้ม
        else if(sClass === "M") color = "#ff3300"; // แดง

        if (type === "V") radius = Math.pow(mass, 0.8);
        else if (type === "III") radius = 8 + (mass * 0.5);
        else if (type === "I") radius = 50;
        else if (type === "d") { radius = 0.015; mass = 0.6; temp = 15000; color = "#e0f0ff"; }

        // คำนวณ Luminosity (L ~ R^2 * T^4)
        let lum = Math.pow(radius, 2) * Math.pow(temp/5800, 4);

        return { mass, temp, radius, color, lum, sClass };
    }

    function updateDynamics() {
        system.dist = parseFloat(document.getElementById('distAU').value);
        system.inc = parseFloat(document.getElementById('inc').value);
        document.getElementById('auVal').innerText = system.dist;
        document.getElementById('incVal').innerText = system.inc;

        stars.a = getAstroData(document.getElementById('classA').value, document.getElementById('subA').value, document.getElementById('typeA').value);
        stars.b = getAstroData(document.getElementById('classB').value, document.getElementById('subB').value, document.getElementById('typeB').value);

        // กำหนด Primary/Secondary จากความสว่าง (Luminosity)
        const aIsPrimary = stars.a.lum >= stars.b.lum;
        const roleA = aIsPrimary ? "PRIMARY" : "SECONDARY";
        const roleB = aIsPrimary ? "SECONDARY" : "PRIMARY";

        let totalM = stars.a.mass + stars.b.mass;
        system.period = Math.sqrt(Math.pow(system.dist, 3) / totalM);
        system.velocity = (29.78 * Math.sqrt(totalM / system.dist)); 

        document.getElementById('physicsReadout').innerHTML = `Period: ${system.period.toFixed(3)} yrs<br>V_sys: ${system.velocity.toFixed(1)} km/s`;
        
        const updateReadout = (el, star, role) => {
            el.style.color = star.color;
            el.innerHTML = `<b>${role}</b><br>Mass: ${star.mass.toFixed(2)} M⊙<br>Radius: ${star.radius.toFixed(2)} R⊙<br>Temp: ${star.temp.toFixed(0)} K`;
        };
        updateReadout(document.getElementById('starAReadout'), stars.a, roleA);
        updateReadout(document.getElementById('starBReadout'), stars.b, roleB);
        
        updateStaticPlots();
    }

    function calcLight(p) {
        const incRad = system.inc * Math.PI / 180;
        const x = Math.cos(p), y = Math.sin(p) * Math.cos(incRad);
        const d = Math.sqrt(x*x + y*y);
        const L_a = stars.a.lum, L_b = stars.b.lum;
        const totalL = L_a + L_b;
        const r1 = stars.a.radius * 0.02, r2 = stars.b.radius * 0.02;
        if (d < (r1 + r2)) {
            const overlap = Math.max(0, (r1 + r2 - d) / (r1 + r2));
            return (Math.sin(p) > 0) ? (totalL - (L_b * overlap * 0.85))/totalL : (totalL - (L_a * overlap * 0.85))/totalL;
        }
        return 1.0;
    }

    function animate() {
        const incRad = system.inc * Math.PI / 180;
        oCtx.clearRect(0,0,500,300); sCtx.clearRect(0,0,500,300);
        const x = Math.cos(phase)*100, y = Math.sin(phase)*100*Math.cos(incRad);
        
        // Orbit Canvas
        oCtx.strokeStyle = "#1a2a44"; oCtx.beginPath(); oCtx.ellipse(250,150,100,100*Math.cos(incRad),0,0,Math.PI*2); oCtx.stroke();
        const drawS = (ctx, x, y, r, col) => {
            ctx.shadowBlur = 15; ctx.shadowColor = col; ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(x,y, Math.max(2, Math.min(25, r*1.5)), 0, 7); ctx.fill();
            ctx.shadowBlur = 0;
        };
        if(Math.sin(phase)>0){ drawS(oCtx,250-x,150-y,stars.b.radius,stars.b.color); drawS(oCtx,250+x,150+y,stars.a.radius,stars.a.color); }
        else { drawS(oCtx,250+x,150+y,stars.a.radius,stars.a.color); drawS(oCtx,250-x,150-y,stars.b.radius,stars.b.color); }

        // Spectroscopy Canvas
        const vA = (stars.b.mass/(stars.a.mass+stars.b.mass)) * system.velocity * Math.sin(incRad) * Math.sin(phase);
        const vB = -(stars.a.mass/(stars.a.mass+stars.b.mass)) * system.velocity * Math.sin(incRad) * Math.sin(phase);

        const grad = sCtx.createLinearGradient(50,0,450,0);
        grad.addColorStop(0,"#4444ff"); grad.addColorStop(0.5, "#ffffff"); grad.addColorStop(1,"#ff4444");
        sCtx.fillStyle = grad; sCtx.fillRect(50, 100, 400, 80);
        
        const drawLine = (vel, star, lbl, yOff) => {
            const lx = 250 + vel*1.5;
            sCtx.strokeStyle = star.color; sCtx.lineWidth = 3;
            sCtx.beginPath(); sCtx.moveTo(lx, 90); sCtx.lineTo(lx, 190); sCtx.stroke();
            sCtx.fillStyle = star.color; sCtx.font = "bold 12px Arial";
            sCtx.fillText(`${lbl}: ${vel.toFixed(1)} km/s`, lx - 35, yOff);
        };
        drawLine(vA, stars.a, "Star A", 85);
        drawLine(vB, stars.b, "Star B", 205);

        if(window.Plotly) {
            const deg = (phase*180/Math.PI)%360;
            Plotly.restyle('rv', {
                x:[[deg],[deg]], 
                y:[[vA],[vB]],
                'marker.color': [stars.a.color, stars.b.color]
            }, [2,3]);
            Plotly.restyle('lc', {x:[[deg]], y:[[calcLight(phase)]]}, [1]);
        }
        phase += 0.05 / (system.period + 0.1);
        requestAnimationFrame(animate);
    }

    function init() {
        const layout = { paper_bgcolor:'black', plot_bgcolor:'#050a18', margin:{t:30,b:35,l:45,r:15}, font:{color:'#7fd4ff', size:10}, xaxis:{gridcolor:'#1a2a44', range:[0,360]}, yaxis:{gridcolor:'#1a2a44', fixedrange:true}};
        Plotly.newPlot('lc', [{x:[], y:[], name:'Relative Flux', line:{color:'yellow'}}, {x:[0], y:[1], mode:'markers', marker:{color:'red'}, name:'Current'}], {...layout, yaxis:{...layout.yaxis, range:[0.1, 1.1]}});
        Plotly.newPlot('rv', [
            {x:[], y:[], name:'Orbit A', line:{dash:'dot'}}, 
            {x:[], y:[], name:'Orbit B', line:{dash:'dot'}}, 
            {x:[0], y:[0], mode:'markers', name:'Star A'}, 
            {x:[0], y:[0], mode:'markers', name:'Star B'}
        ], {...layout, yaxis:{...layout.yaxis, range:[-200, 200]}});
        
        document.querySelectorAll('input, select').forEach(el => el.oninput = updateDynamics);
        updateDynamics(); animate();
    }

    function updateStaticPlots() {
        let x=[], yL=[], yA=[], yB=[];
        const incRad = system.inc * Math.PI / 180;
        for(let i=0; i<=360; i+=2) {
            let p = i*Math.PI/180; x.push(i);
            yL.push(calcLight(p));
            yA.push((stars.b.mass/(stars.a.mass+stars.b.mass)) * system.velocity * Math.sin(incRad) * Math.sin(p));
            yB.push(-(stars.a.mass/(stars.a.mass+stars.b.mass)) * system.velocity * Math.sin(incRad) * Math.sin(p));
        }
        Plotly.restyle('lc', {x:[x], y:[yL]}, [0]);
        Plotly.restyle('rv', {
            x:[x,x], y:[yA,yB],
            'line.color': [stars.a.color, stars.b.color],
            'marker.color': [null, null, stars.a.color, stars.b.color]
        }, [0,1,2,3]);
    }
    window.onload = init;
</script>
</body>
</html>
