<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Star Pro: Doppler Legend & Halo Edition</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; background: #04060f; color: #7fd4ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 95%; max-width: 1200px; margin: 20px; background: rgba(15, 25, 50, 0.7); border: 1px solid rgba(127, 212, 255, 0.2); border-radius: 20px; padding: 25px; backdrop-filter: blur(15px); box-shadow: 0 10px 50px rgba(0,0,0,0.8); }
        .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        canvas { width: 100%; background: radial-gradient(circle, #0a1128 0%, #04060f 100%); border-radius: 15px; border: 1px solid #1a2a44; }
        .controls { text-align: center; margin-bottom: 20px; padding: 15px; background: rgba(127, 212, 255, 0.05); border-radius: 12px; }
        .label { color: #5da9ff; font-size: 0.85em; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; }
        h2 { margin: 0 0 15px 0; text-align: center; color: #fff; text-shadow: 0 0 10px rgba(127, 212, 255, 0.5); }
    </style>
</head>
<body>

<div class="dashboard">
    <h2>Astro-Physical Binary Observation</h2>
    
    <div class="controls">
        <label>System Inclination (i): </label>
        <input type="range" id="incRange" min="0" max="90" value="88" style="width: 300px;">
        <span id="incValue" style="font-family: monospace; font-size: 1.2em; margin-left: 10px;">88°</span>
    </div>

    <div class="viz-grid">
        <div>
            <div class="label">Orbital Dynamics (Halo & Limb Darkening)</div>
            <canvas id="orbitCanvas" width="550" height="400"></canvas>
        </div>
        <div>
            <div class="label">Doppler Spectroscopy (Shift Indicators)</div>
            <canvas id="specCanvas" width="550" height="400"></canvas>
        </div>
    </div>

    <div class="viz-grid">
        <div>
            <div class="label">Radial Velocity (RV) Plot</div>
            <div id="rvPlot" style="height:300px;"></div>
        </div>
        <div>
            <div class="label">Photometric Light Curve</div>
            <div id="lcPlot" style="height:300px;"></div>
        </div>
    </div>
</div>

<script>
    const orbitCanvas = document.getElementById('orbitCanvas');
    const specCanvas = document.getElementById('specCanvas');
    const incRange = document.getElementById('incRange');
    const incValue = document.getElementById('incValue');
    const oCtx = orbitCanvas.getContext('2d');
    const sCtx = specCanvas.getContext('2d');

    let phase = 0;
    let inclination = 88;
    const ampWhite = 35;
    const ampBlue = 60;
    const orbitR = 125; 

    incRange.addEventListener('input', (e) => {
        inclination = e.target.value;
        incValue.innerText = inclination + "°";
        updateStaticPlots();
    });

    function drawStar(ctx, x, y, r, baseColor, isWhite) {
        const halo = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 2.5);
        halo.addColorStop(0, baseColor + "66");
        halo.addColorStop(1, "transparent");
        ctx.fillStyle = halo;
        ctx.globalCompositeOperation = 'screen';
        ctx.beginPath(); ctx.arc(x, y, r * 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';

        const body = ctx.createRadialGradient(x - r*0.2, y - r*0.2, 0, x, y, r);
        if (isWhite) {
            body.addColorStop(0, '#ffffff');
            body.addColorStop(0.4, '#f0f0f0');
            body.addColorStop(1, '#aaaaaa');
        } else {
            body.addColorStop(0, '#b0e0ff');
            body.addColorStop(0.4, '#66ccff'); 
            body.addColorStop(1, '#3b9dff');
        }
        ctx.fillStyle = body;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    function drawIndicator(ctx, x, yStart, yEnd, color, velocity) {
        const overshoot = 15;
        ctx.strokeStyle = "rgba(0,0,0,0.9)"; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(x, yStart); ctx.lineTo(x, yEnd); ctx.stroke();
        ctx.strokeStyle = color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, yStart - overshoot); ctx.lineTo(x, yEnd + overshoot); ctx.stroke();
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, yStart - overshoot, 5, 0, Math.PI * 2); ctx.fill();
        
        ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
        ctx.fillStyle = velocity > 0 ? "#ff6666" : (velocity < 0 ? "#66ccff" : "#ffffff");
        ctx.fillText(`${velocity > 0 ? "+" : ""}${velocity.toFixed(1)} km/s`, x, yEnd + overshoot + 18);
    }

    function calculateLight(p, incRad) {
        const x = Math.cos(p);
        const y = Math.sin(p) * Math.cos(incRad);
        const distSq = x*x + y*y;
        const r1 = 0.28, r2 = 0.18; 
        let brightness = 1.0;
        if (distSq < (r1 + r2)**2) {
            const dist = Math.sqrt(distSq);
            const overlap = Math.max(0, (r1 + r2 - dist) / (r1 + r2));
            const ldFactor = Math.pow(overlap, 1.4);
            if (Math.sin(p) > 0) brightness -= 0.18 * ldFactor; 
            else brightness -= 0.42 * ldFactor; 
        }
        return brightness;
    }

    function animate() {
        const incRad = inclination * Math.PI / 180;
        const cx = orbitCanvas.width / 2;
        const cy = orbitCanvas.height / 2;

        oCtx.clearRect(0, 0, orbitCanvas.width, orbitCanvas.height);
        sCtx.clearRect(0, 0, specCanvas.width, specCanvas.height);

        const x = Math.cos(phase) * orbitR;
        const y = Math.sin(phase) * orbitR * Math.cos(incRad);

        oCtx.strokeStyle = "rgba(127, 212, 255, 0.1)";
        oCtx.beginPath(); oCtx.ellipse(cx, cy, orbitR, orbitR * Math.cos(incRad), 0, 0, Math.PI * 2); oCtx.stroke();

        if (Math.sin(phase) > 0) {
            drawStar(oCtx, cx - x, cy - y, 14, "#66ccff", false);
            drawStar(oCtx, cx + x, cy + y, 24, "#ffffff", true);
        } else {
            drawStar(oCtx, cx + x, cy + y, 24, "#ffffff", true);
            drawStar(oCtx, cx - x, cy - y, 14, "#66ccff", false);
        }

        // --- Spectroscopy Drawing ---
        const sCenter = specCanvas.width / 2;
        const barH = 100, barY = 130;
        const barW = specCanvas.width - 120;
        
        // Gradient Spectrum Bar
        const grad = sCtx.createLinearGradient(60, 0, specCanvas.width - 60, 0);
        grad.addColorStop(0, "#1a1aff"); grad.addColorStop(0.5, "#ffffff"); grad.addColorStop(1, "#ff1a1a");
        sCtx.fillStyle = grad; sCtx.fillRect(60, barY, barW, barH);

        // Legend: Blueshift / Redshift
        sCtx.font = "bold 13px Arial";
        sCtx.fillStyle = "#55aaff"; sCtx.textAlign = "left";
        sCtx.fillText("← BLUESHIFT (Toward)", 60, barY - 30);
        
        sCtx.fillStyle = "#ff5555"; sCtx.textAlign = "right";
        sCtx.fillText("REDSHIFT (Away) →", specCanvas.width - 60, barY - 30);

        // Indicators
        const sinInc = Math.sin(incRad);
        const vW = ampWhite * sinInc * Math.sin(phase);
        const vB = -ampBlue * sinInc * Math.sin(phase);

        drawIndicator(sCtx, sCenter + (Math.sin(phase) * 100 * sinInc * 0.5), barY, barY + barH, "#ffffff", vW);
        drawIndicator(sCtx, sCenter - (Math.sin(phase) * 100 * sinInc), barY, barY + barH, "#66ccff", vB);

        // Update Markers
        const currLight = calculateLight(phase, incRad);
        Plotly.restyle('rvPlot', { x: [[phase], [phase]], y: [[vW], [vB]] }, [2, 3]);
        Plotly.restyle('lcPlot', { x: [[phase]], y: [[currLight]] }, [1]);

        phase = (phase + 0.02) % (2 * Math.PI);
        requestAnimationFrame(animate);
    }

    function initPlots() {
        const xV = []; for (let i = 0; i <= 100; i++) xV.push((i / 100) * 2 * Math.PI);
        const commonLayout = {
            paper_bgcolor: 'transparent', plot_bgcolor: 'rgba(0,0,0,0.3)',
            margin: { t: 10, b: 40, l: 50, r: 15 },
            xaxis: { gridcolor: '#1a2a44', range: [0, 2*Math.PI], tickvals: [0, Math.PI, 2*Math.PI], ticktext: ['0', 'π', '2π'], color: '#7fd4ff' },
            yaxis: { gridcolor: '#1a2a44', color: '#7fd4ff' },
            font: { color: '#7fd4ff', size: 10 }, showlegend: false
        };

        Plotly.newPlot('rvPlot', [
            { x: xV, y: [], mode: 'lines', line: { color: 'rgba(255,255,255,0.2)', dash: 'dot' } },
            { x: xV, y: [], mode: 'lines', line: { color: 'rgba(102,204,255,0.2)', dash: 'dot' } },
            { x: [0], y: [0], mode: 'markers', marker: { color: '#fff', size: 12, line: {color: '#000', width: 1} } },
            { x: [0], y: [0], mode: 'markers', marker: { color: '#66ccff', size: 12, line: {color: '#000', width: 1} } }
        ], { ...commonLayout, yaxis: { ...commonLayout.yaxis, title: 'Velocity (km/s)', range: [-70, 70] } });

        Plotly.newPlot('lcPlot', [
            { x: xV, y: [], mode: 'lines', line: { color: '#ffcc00', width: 3 } },
            { x: [0], y: [1], mode: 'markers', marker: { color: '#ff4400', size: 10, symbol: 'diamond' } }
        ], { ...commonLayout, yaxis: { ...commonLayout.yaxis, title: 'Flux', range: [0.5, 1.1] } });

        updateStaticPlots();
    }

    function updateStaticPlots() {
        const yW = [], yB = [], yL = [];
        const incRad = inclination * Math.PI / 180;
        const sinInc = Math.sin(incRad);
        for (let i = 0; i <= 100; i++) {
            let p = (i / 100) * 2 * Math.PI;
            yW.push(ampWhite * sinInc * Math.sin(p));
            yB.push(-ampBlue * sinInc * Math.sin(p));
            yL.push(calculateLight(p, incRad));
        }
        Plotly.restyle('rvPlot', { y: [yW, yB] }, [0, 1]);
        Plotly.restyle('lcPlot', { y: [yL] }, [0]);
    }

    initPlots();
    animate();
</script>

</body>
</html>
