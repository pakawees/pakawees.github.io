<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Advanced Binary Star Lab - demo15</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body { margin: 0; background: #050a18; color: #7fd4ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 98%; max-width: 1200px; margin: 15px; background: #0a1128; border: 1px solid #1a2a44; border-radius: 10px; padding: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .master-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; background: rgba(127, 212, 255, 0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(127, 212, 255, 0.1); font-size: 0.9em; }
        .ctrl-group { display: flex; flex-direction: column; gap: 8px; border-right: 1px solid rgba(127, 212, 255, 0.1); padding: 0 10px; }
        .ctrl-group:last-child { border-right: none; }
        .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        canvas { width: 100%; background: #000; border: 1px solid #1a2a44; border-radius: 5px; }
        .plot-container { height: 260px; background: #000; border-radius: 5px; }
        .data-readout { font-family: monospace; font-size: 0.8em; color: #0f0; margin-top: 5px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; }
        select, input { background: #1a2a44; color: #fff; border: 1px solid #7fd4ff; border-radius: 3px; padding: 2px; }
    </style>
</head>
<body>

<div class="dashboard">
    <h2 style="text-align:center; margin-top:0; color:#fff; letter-spacing:1px;">BINARY SYSTEM DYNAMICS</h2>
    
    <div class="master-controls">
        <div class="ctrl-group">
            <b style="color:#ffcc00">SYSTEM PHYSICS</b>
            <div>Distance: <input type="range" id="distAU" min="0.1" max="10" value="1.0" step="0.1"> <span id="auVal">1.0</span> AU</div>
            <div>Inclination: <input type="range" id="inc" min="0" max="90" value="88"> <span id="incVal">88</span>°</div>
            <div id="physicsReadout" class="data-readout">Calculating dynamics...</div>
        </div>

        <div class="ctrl-group">
            <b style="color:#fff">STAR A (Secondary)</b>
            <div>Spectral: 
                <select id="classA">
                    <option value="O">O</option><option value="B">B</option><option value="A">A</option>
                    <option value="F" selected>F</option><option value="G">G</option><option value="K">K</option><option value="M">M</option>
                </select>
                Sub: <input type="number" id="subA" min="0" max="9" value="0" style="width:35px">
            </div>
            <div>Type: 
                <select id="typeA">
                    <option value="I">I (Supergiant)</option><option value="III" selected>III (Giant)</option><option value="V">V (Dwarf)</option>
                </select>
            </div>
            <div id="starAReadout" class="data-readout"></div>
        </div>

        <div class="ctrl-group">
            <b style="color:#fff">STAR B (Primary)</b>
            <div>Spectral: 
                <select id="classB">
                    <option value="O">O</option><option value="B" selected>B</option><option value="A">A</option>
                    <option value="F">F</option><option value="G">G</option><option value="K">K</option><option value="M">M</option>
                </select>
                Sub: <input type="number" id="subB" min="0" max="9" value="1.7" style="width:35px">
            </div>
            <div>Type: 
                <select id="typeB">
                    <option value="I">I</option><option value="III">III</option><option value="V" selected>V (Dwarf)</option>
                </select>
            </div>
            <div id="starBReadout" class="data-readout"></div>
        </div>
    </div>

    <div class="viz-grid">
        <canvas id="orbit" width="500" height="300"></canvas>
        <canvas id="spec" width="500" height="300"></canvas>
        <div id="lc" class="plot-container"></div>
        <div id="rv" class="plot-container"></div>
    </div>
</div>

<script>
    const oCtx = document.getElementById('orbit').getContext('2d');
    const sCtx = document.getElementById('spec').getContext('2d');
    
    let phase = 0;
    let system = { dist: 1.0, inc: 88, velocity: 0, period: 0 };
    let stars = { a: {}, b: {} };

    // อ้างอิงมวลและอุณหภูมิตาม Spectral Class (Solar units)
    function getAstroData(sClass, sub, type) {
        const massMap = { O: 40, B: 10, A: 2.1, F: 1.4, G: 1.0, K: 0.8, M: 0.4 };
        const tempMap = { O: 35000, B: 20000, A: 9000, F: 7000, G: 5600, K: 4500, M: 3200 };
        
        let mass = massMap[sClass] * (1 - sub/20);
        let temp = tempMap[sClass] * (1 - sub/20);
        let radius = (type === "V") ? Math.pow(mass, 0.8) : (type === "III" ? 6.5 : 50);

        let color = "#fff";
        if(temp > 20000) color = "#9bb2ff";
        else if(temp > 8000) color = "#f8f7ff";
        else if(temp > 5000) color = "#fff2a1";
        else color = "#ff6060";

        return { mass, temp, radius, color };
    }

    function updateDynamics() {
        system.dist = parseFloat(document.getElementById('distAU').value);
        system.inc = parseFloat(document.getElementById('inc').value);
        document.getElementById('auVal').innerText = system.dist;
        document.getElementById('incVal').innerText = system.inc;

        stars.a = getAstroData(document.getElementById('classA').value, document.getElementById('subA').value, document.getElementById('typeA').value);
        stars.b = getAstroData(document.getElementById('classB').value, document.getElementById('subB').value, document.getElementById('typeB').value);

        // Kepler's 3rd Law: P^2 = a^3 / M_total (P in years, a in AU, M in Solar Mass)
        let totalM = stars.a.mass + stars.b.mass;
        system.period = Math.sqrt(Math.pow(system.dist, 3) / totalM); // Years
        
        // Velocity (km/s) = (2 * pi * a) / P -> ในหน่วย Solar/AU แปลงเป็น km/s ประมาณนี้:
        system.velocity = (30 * Math.sqrt(totalM / system.dist)); // 30 km/s คือความเร็วโลก

        // Update Readouts
        document.getElementById('physicsReadout').innerHTML = `Period: ${system.period.toFixed(2)} yrs<br>Avg Vel: ${system.velocity.toFixed(1)} km/s`;
        document.getElementById('starAReadout').innerHTML = `Mass: ${stars.a.mass.toFixed(1)} M⊙<br>Temp: ${stars.a.temp.toFixed(0)} K`;
        document.getElementById('starBReadout').innerHTML = `Mass: ${stars.b.mass.toFixed(1)} M⊙<br>Temp: ${stars.b.temp.toFixed(0)} K`;

        updateStaticPlots();
    }

    function calcLight(p) {
        const incRad = system.inc * Math.PI / 180;
        const x = Math.cos(p), y = Math.sin(p) * Math.cos(incRad);
        const dist = Math.sqrt(x*x + y*y);
        
        // Stefan-Boltzmann Flux: L = R^2 * T^4
        const L_a = Math.pow(stars.a.radius, 2) * Math.pow(stars.a.temp/5800, 4);
        const L_b = Math.pow(stars.b.radius, 2) * Math.pow(stars.b.temp/5800, 4);
        const totalL = L_a + L_b;

        // Visual radius scaling for eclipse
        const r1 = stars.a.radius * 0.02, r2 = stars.b.radius * 0.02;
        if (dist < (r1 + r2)) {
            const overlap = Math.max(0, (r1 + r2 - dist) / (r1 + r2));
            if (Math.sin(p) > 0) return (totalL - (L_b * overlap * 0.7)) / totalL;
            else return (totalL - (L_a * overlap * 0.7)) / totalL;
        }
        return 1.0;
    }

    function animate() {
        const incRad = system.inc * Math.PI / 180;
        oCtx.clearRect(0,0,500,300); sCtx.clearRect(0,0,500,300);

        // Orbit Circle
        const orbitScale = 100;
        oCtx.strokeStyle = "rgba(127,212,255,0.1)";
        oCtx.beginPath(); oCtx.ellipse(250,150, orbitScale, orbitScale*Math.cos(incRad), 0, 0, Math.PI*2); oCtx.stroke();

        const x = Math.cos(phase)*orbitScale, y = Math.sin(phase)*orbitScale*Math.cos(incRad);
        
        // Stars
        const drawS = (ctx, x, y, r, col) => {
            ctx.shadowBlur = 15; ctx.shadowColor = col; ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(x,y, Math.max(3, Math.min(30, r*0.5)), 0, 7); ctx.fill();
            ctx.shadowBlur = 0;
        };

        if(Math.sin(phase) > 0) {
            drawS(oCtx, 250-x, 150-y, stars.b.radius, stars.b.color);
            drawS(oCtx, 250+x, 150+y, stars.a.radius, stars.a.color);
        } else {
            drawS(oCtx, 250+x, 150+y, stars.a.radius, stars.a.color);
            drawS(oCtx, 250-x, 150-y, stars.b.radius, stars.b.color);
        }

        // Spectroscopy (Doppler Shift)
        const shiftA = (stars.b.mass / (stars.a.mass + stars.b.mass)) * system.velocity * Math.sin(incRad) * Math.sin(phase);
        const shiftB = -(stars.a.mass / (stars.a.mass + stars.b.mass)) * system.velocity * Math.sin(incRad) * Math.sin(phase);

        sCtx.fillStyle = stars.a.color; sCtx.fillRect(250 + shiftA*1.5, 100, 3, 100);
        sCtx.fillStyle = stars.b.color; sCtx.fillRect(250 + shiftB*1.5, 100, 3, 100);

        if(window.Plotly) {
            const deg = (phase*180/Math.PI)%360;
            Plotly.restyle('rv', {x:[[deg],[deg]], y:[[shiftA],[shiftB]]}, [2,3]);
            Plotly.restyle('lc', {x:[[deg]], y:[[calcLight(phase)]]}, [1]);
        }

        // ความเร็วอนิเมชั่นจะสัมพันธ์กับ Period (ถ้าดาวห่างกันมาก จะหมุนช้าลง)
        phase += 0.05 / (system.period + 0.1);
        requestAnimationFrame(animate);
    }

    function init() {
        const layout = { paper_bgcolor:'black', plot_bgcolor:'#050a18', margin:{t:10,b:35,l:40,r:10}, font:{color:'#7fd4ff', size:10}, xaxis:{gridcolor:'#1a2a44'}, yaxis:{gridcolor:'#1a2a44'} };
        Plotly.newPlot('lc', [{x:[], y:[], name:'Flux', line:{color:'yellow'}}, {x:[0], y:[1], mode:'markers', marker:{color:'red'}}], layout);
        Plotly.newPlot('rv', [
            {x:[], y:[], name:'RV A', line:{dash:'dot', width:1}}, {x:[], y:[], name:'RV B', line:{dash:'dot', width:1}},
            {x:[0], y:[0], mode:'markers', name:'A'}, {x:[0], y:[0], mode:'markers', name:'B'}
        ], layout);
        
        document.querySelectorAll('input, select').forEach(el => el.oninput = updateDynamics);
        updateDynamics(); animate();
    }

    function updateStaticPlots() {
        if(!window.Plotly) return;
        let x=[], yL=[], yA=[], yB=[];
        const incRad = system.inc * Math.PI / 180;
        for(let i=0; i<=360; i+=2) {
            let p = i*Math.PI/180; x.push(i);
            yL.push(calcLight(p));
            yA.push((stars.b.mass / (stars.a.mass + stars.b.mass)) * system.velocity * Math.sin(incRad) * Math.sin(p));
            yB.push(-(stars.a.mass / (stars.a.mass + stars.b.mass)) * system.velocity * Math.sin(incRad) * Math.sin(p));
        }
        Plotly.restyle('lc', {x:[x], y:[yL]}, [0]);
        Plotly.restyle('rv', {x:[x,x], y:[yA,yB]}, [0,1]);
    }

    window.onload = init;
</script>
</body>
</html>
