<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Binary System Demo</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #050816;
            color: #7fd4ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            width: 90%;
            max-width: 1000px;
            margin-top: 50px;
            background: rgba(20, 30, 60, 0.6);
            border: 1px solid rgba(127, 212, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .viz-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .viz-container { grid-template-columns: 1fr; }
        }

        canvas {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(127, 212, 255, 0.1);
            border-radius: 10px;
        }

        h2 { margin-top: 0; letter-spacing: 2px; text-transform: uppercase; }
        .label { color: #8caed6; font-size: 0.9em; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="dashboard">
    <h2>Binary System Observation Deck</h2>
    
    <div class="controls">
        <label>System Inclination: </label>
        <input type="range" id="incRange" min="0" max="90" value="45" style="width: 200px;">
        <span id="incValue">45°</span>
    </div>

    <div class="viz-container">
        <!-- Orbital Visualization -->
        <div>
            <div class="label">Orbital Simulation</div>
            <canvas id="orbitCanvas" width="450" height="350"></canvas>
        </div>
        
        <!-- Doppler Spectroscopy -->
        <div>
            <div class="label">Doppler Spectroscopy (Absorption Lines)</div>
            <canvas id="specCanvas" width="450" height="350"></canvas>
        </div>
    </div>

    <!-- Radial Velocity Graph -->
    <div class="label">Real-time Radial Velocity Curve</div>
    <div id="rvPlot" style="width:100%; height:300px;"></div>
</div>

<script>
    const orbitCanvas = document.getElementById('orbitCanvas');
    const specCanvas = document.getElementById('specCanvas');
    const incRange = document.getElementById('incRange');
    const incValue = document.getElementById('incValue');

    const oCtx = orbitCanvas.getContext('2d');
    const sCtx = specCanvas.getContext('2d');

    let phase = 0;
    let inclination = 45;

    // Update Inclination
    incRange.addEventListener('input', (e) => {
        inclination = e.target.value;
        incValue.innerText = inclination + "°";
    });

    function drawGlow(ctx, x, y, r, color) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
        g.addColorStop(0, color);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    function animate() {
        const incRad = inclination * Math.PI / 180;
        const cx = orbitCanvas.width / 2;
        const cy = orbitCanvas.height / 2;
        const orbitR = 100;

        // 1. Clear Canvases
        oCtx.clearRect(0, 0, orbitCanvas.width, orbitCanvas.height);
        sCtx.clearRect(0, 0, specCanvas.width, specCanvas.height);

        // 2. Draw Orbit
        const x = Math.cos(phase) * orbitR;
        const y = Math.sin(phase) * orbitR * Math.cos(incRad);

        oCtx.strokeStyle = "rgba(127, 212, 255, 0.2)";
        oCtx.beginPath();
        oCtx.ellipse(cx, cy, orbitR, orbitR * Math.cos(incRad), 0, 0, Math.PI * 2);
        oCtx.stroke();

        if (y > 0) {
            drawGlow(oCtx, cx - x, cy - y, 10, "#66ccff"); // Star B
            drawGlow(oCtx, cx + x, cy + y, 18, "#ffffff"); // Star A
        } else {
            drawGlow(oCtx, cx + x, cy + y, 18, "#ffffff");
            drawGlow(oCtx, cx - x, cy - y, 10, "#66ccff");
        }

        // 3. Draw Spectroscopy
        const sCenter = specCanvas.width / 2;
        const grad = sCtx.createLinearGradient(50, 0, specCanvas.width - 50, 0);
        grad.addColorStop(0, "#2244ff"); grad.addColorStop(0.5, "#ffffff"); grad.addColorStop(1, "#ff3333");
        
        sCtx.fillStyle = grad;
        sCtx.fillRect(50, 120, specCanvas.width - 100, 80);

        const amp = 60 * Math.sin(incRad);
        const shift = Math.sin(phase) * amp;

        // Absorption Lines
        sCtx.lineWidth = 4;
        sCtx.strokeStyle = "rgba(0,0,0,0.8)";
        
        // Line A (White Star)
        sCtx.beginPath(); sCtx.moveTo(sCenter + (shift * 0.5), 110); sCtx.lineTo(sCenter + (shift * 0.5), 210); sCtx.stroke();
        // Line B (Blue Star)
        sCtx.beginPath(); sCtx.moveTo(sCenter - shift, 110); sCtx.lineTo(sCenter - shift, 210); sCtx.stroke();

        sCtx.fillStyle = "#cbdfff";
        sCtx.font = "14px Arial";
        sCtx.fillText("← Blueshift", 50, 230);
        sCtx.fillText("Redshift →", specCanvas.width - 120, 230);

        // 4. Update Plotly
        updatePlot();

        phase += 0.03;
        requestAnimationFrame(animate);
    }

    // Plotly Setup
    const rvData = {
        x: [], y1: [], y2: [],
        type: 'scatter',
        mode: 'lines'
    };

    function initPlot() {
        const layout = {
            paper_bgcolor: 'transparent',
            plot_bgcolor: 'rgba(0,0,0,0.2)',
            margin: { t: 10, b: 40, l: 40, r: 10 },
            xaxis: { gridcolor: '#222', title: 'Time Phase' },
            yaxis: { gridcolor: '#222', title: 'Velocity', range: [-70, 70] },
            font: { color: '#7fd4ff' },
            showlegend: false
        };
        Plotly.newPlot('rvPlot', [
            { x: [], y: [], name: 'Star A', line: { color: '#fff' } },
            { x: [], y: [], name: 'Star B', line: { color: '#66ccff' } }
        ], layout);
    }

    let plotCounter = 0;
    function updatePlot() {
        const incRad = inclination * Math.PI / 180;
        const v1 = 30 * Math.sin(incRad) * Math.sin(phase);
        const v2 = -50 * Math.sin(incRad) * Math.sin(phase);

        Plotly.extendTraces('rvPlot', {
            x: [[plotCounter], [plotCounter]],
            y: [[v1], [v2]]
        }, [0, 1]);

        if(plotCounter > 50) {
            Plotly.relayout('rvPlot', {
                'xaxis.range': [plotCounter - 50, plotCounter]
            });
        }
        plotCounter++;
    }

    initPlot();
    animate();
</script>

</body>
</html>
